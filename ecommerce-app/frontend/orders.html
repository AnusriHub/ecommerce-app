<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Orders — General Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      General Store
      <span class="brand-tag">Est. Catalog No. 01</span>
    </a>
    <nav class="nav-links" id="nav-auth-slot"></nav>
  </div>
</header>

<div class="page-header container">
  <h1>Order history</h1>
  <p>Everything you've checked out, most recent first.</p>
</div>

<main class="container" style="padding: 32px 0 64px;">
  <div id="orders-list"></div>
  <div class="empty-state" id="empty-orders" style="display:none;">
    <h3>No orders yet</h3>
    <p>Place your first order from the catalog.</p>
    <a href="index.html" class="btn btn-primary" style="margin-top:14px; display:inline-flex;">Browse products</a>
  </div>
</main>

<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
